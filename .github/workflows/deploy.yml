name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Injetar variáveis de ambiente secretas
        run: |
          sed -i "s|__SHEETS_BASE_URL__|${{ secrets.SHEETS_BASE_URL }}|g" src/environments/environment.ts

      - name: Build de produção
        run: |
          npx ng build --base-href /enap-financial-dash/
          cp dist/fincontrol/browser/index.html dist/fincontrol/browser/404.html

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/fincontrol/browser
