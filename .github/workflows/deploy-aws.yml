name: Build and Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Injetar variáveis de ambiente secretas
        env:
          SHEETS_BASE_URL: ${{ secrets.SHEETS_BASE_URL }}
        run: |
          # Use sed para substituir placeholder no environment.ts
          sed -i "s|__SHEETS_BASE_URL__|${SHEETS_BASE_URL}|g" src/environments/environment.ts

      - name: Build de produção
        run: npm run build:prod

      - name: Preparar index.html
        run: |
          # Garante que o index.csr.html seja o ponto de entrada principal no S3
          if [ -f "dist/fincontrol/browser/index.csr.html" ]; then
            cp dist/fincontrol/browser/index.csr.html dist/fincontrol/browser/index.html
          fi

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy para S3
        run: |
          aws s3 sync dist/fincontrol/browser/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/ --delete

      - name: Invalidação do Cache CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
